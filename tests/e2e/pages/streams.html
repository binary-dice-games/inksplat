<!-- A host or a guest with a coloured canvas as its screen: guests offer it on their uplink, the
     host relays the one it picks (spec/07_participant_streaming). -->
<meta charset="utf-8" />
<title>inksplat e2e streams</title>
<video id="v" muted autoplay playsinline width="320" height="180"></video>
<video id="up" muted autoplay playsinline width="320" height="180"></video>
<script type="module">
  import { createSession } from '/packages/collab-session/collab-session.js';

  const q = new URLSearchParams(location.search);
  const role = q.get('role');
  const color = q.get('color');
  const app = (window.app = { role, errors: [], logs: [], state: null });

  /** A canvas of one colour, with a moving square so frames keep coming. */
  function screen() {
    const c = document.createElement('canvas');
    c.width = 320;
    c.height = 180;
    const g = c.getContext('2d');
    let n = 0;
    setInterval(() => {
      g.fillStyle = color;
      g.fillRect(0, 0, 320, 180);
      g.fillStyle = '#fff';
      g.fillRect((n++ * 7) % 300, 150, 20, 20);
    }, 50);
    return c.captureStream(15);
  }

  // `noav1`: this browser cannot receive AV1 (as Safari without hardware support): its offer
  // leaves it out.
  // `only`: it can receive only this codec (its offer lists nothing else).
  // `prefer`: its offer lists these first (default AV1, H.264, VP9, VP8).
  if (q.get('noav1') === '1' || q.get('only')) {
    const only = q.get('only');
    const caps = RTCRtpReceiver.getCapabilities.bind(RTCRtpReceiver);
    RTCRtpReceiver.getCapabilities = (kind) => {
      const c = caps(kind);
      const keep = (x) =>
        only
          ? x.mimeType.toLowerCase() === only.toLowerCase() || /rtx|red|fec/i.test(x.mimeType)
          : !/av1/i.test(x.mimeType);
      return c && { ...c, codecs: c.codecs.filter(keep) };
    };
  }

  const session = await createSession({
    role,
    token: q.get('token') ?? undefined,
    peerId: q.get('id') ?? undefined,
    me: { name: q.get('id') ?? role, color: '#3e63dd' },
    rendezvous: [
      {
        kind: 'torrent',
        urls: [q.get('tracker')],
        announceMs: { host: 1000, guest: 1000 },
        gatherMs: 500,
      },
    ],
    iceServers: [],
    forwardFrames: q.get('forward') !== '0',
    forwardCodecs: q.get('fcodecs') ? q.get('fcodecs').split(',') : undefined,
    sharedEncoder: q.get('shared') !== '0',
    videoCodecs: (q.get('prefer') ?? 'video/AV1,video/H264,video/VP9,video/VP8').split(','),
    log: (...a) => app.logs.push(a.join(' ')),
  });
  app.session = session;
  app.token = session.token;
  session.on('error', (e) => app.errors.push(e.reason ?? e.message));
  session.on('state', (s) => (app.state = s.state));
  app.tracks = 0;
  session.on('track', (stream) => {
    app.tracks += 1;
    document.getElementById('v').srcObject = stream;
  });

  if (role === 'host') {
    app.stream = screen();
    session.mediaParams({ fps: 10, maxBitrate: 400000 });
    session.setMedia(app.stream);
    /** Shows a guest's uplink here and asks it to send. */
    app.ask = (id, on) => {
      session.uplinkParams(id, { active: on, fps: 10, maxBitrate: 400000 });
      document.getElementById('up').srcObject = on ? session.uplink(id) : null;
    };
  } else {
    app.share = (on) => session.setUplink(on ? screen() : null);
  }

  /** Host: frames each guest's downlink encoder made itself, by peer id. */
  app.encodedBy = async () => {
    const out = {};
    for (const [id, entry] of session.links) {
      const sender = entry.link.pc.getTransceivers()[0].sender;
      let n = 0;
      (await sender.getStats()).forEach((r) => {
        if (r.type === 'outbound-rtp') n += r.framesEncoded ?? 0;
      });
      out[id] = n;
    }
    return out;
  };

  /** The codec (MIME type) of the video this page receives from the host, or null. */
  app.inbound = async () => {
    const pc = [...session.links.values()][0]?.link.pc;
    if (!pc) return null;
    const report = await pc.getStats();
    const codecs = {};
    let id = null;
    report.forEach((r) => {
      if (r.type === 'codec') codecs[r.id] = r.mimeType;
      if (r.type === 'inbound-rtp' && r.kind === 'video' && r.framesDecoded > 0) id = r.codecId;
    });
    return id ? codecs[id] : null;
  };

  /** The colour in the corner of a video: red, green, blue, or another. */
  app.color = (id = 'v') => {
    const v = document.getElementById(id);
    if (!v.videoWidth) return null;
    const c = document.createElement('canvas');
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    const g = c.getContext('2d');
    g.drawImage(v, 0, 0);
    const [r, gg, b] = g.getImageData(5, 5, 1, 1).data;
    const hi = (x) => x > 150;
    const lo = (x) => x < 100;
    if (hi(r) && lo(gg) && lo(b)) return 'red';
    if (lo(r) && hi(gg) && lo(b)) return 'green';
    if (lo(r) && lo(gg) && hi(b)) return 'blue';
    return `${r},${gg},${b}`;
  };
  app.ready = true;
</script>
